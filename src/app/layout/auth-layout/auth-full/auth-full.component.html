<ng-container>
  <div>
    <h2 class="text-3xl font-semibold tracking-tight text-app-text-primary">
      {{ isSignUp() ? 'Ro\'yxatdan o\'tish' : 'Xush kelibsiz' }}
    </h2>
  </div>

  <div class="mt-8">
    <router-outlet></router-outlet>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-app-border"></div>
      </div>
      <div class="relative flex font-medium justify-center text-xs uppercase">
        <span class="bg-app-bg px-2 text-app-text-muted">Yoki quyidagi usul orqali kiring</span>
      </div>
    </div>

    <app-oauth
      (signIn)="signInWithOauth($event)"
      [loadingProvider]="loadingProvider()"
    />

    <div class="my-6 text-center">
      <p class="text-sm text-app-text-secondary">
        Hisobingiz {{ isSignUp() ? 'bormi?' : 'yo\'qmi?' }}
        <a 
          [routerLink]="isSignUp() ? 'sign-in' : 'sign-up'" 
          class="font-semibold cursor-pointer no-underline hover:underline text-green-400 hover:text-green-500 transition-colors"
        >
          {{ isSignUp() ? 'Tizimga kiring' : 'Ro\'yxatdan o\'ting' }}
        </a>
      </p>
    </div>

    <p class="text-xs text-gray-400 text-center">
      © {{ year }} thechblog. <a href="#" class="text-app-text-muted no-underline hover:underline">Maxfiylik siyosati</a>
    </p>
  </div>
</ng-container>
