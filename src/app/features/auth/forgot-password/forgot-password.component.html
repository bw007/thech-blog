<div class="flex flex-col items-center">
  <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center mb-6">
    <tui-icon 
      icon="@tui.key-round" 
      class="text-blue-500" 
      [style.fontSize.rem]="1.5" 
    />
  </div>

  <h1 class="text-xl font-bold text-gray-900 mb-2">Parolni tiklash</h1>
  <p class="text-sm text-center text-gray-500 mb-8 max-w-xs">
    Elektron pochtangizni kiriting va parolni yangilash uchun havola oling.
  </p>

  <form
    #forgotForm="ngForm"
    (ngSubmit)="onSendLink()"
    class="space-y-4 w-full max-w-sm"
  >
    <div>
      <tui-textfield
        iconStart="@tui.mail"
        class="mb-0!"
        tuiTextfieldSize="m"
      >
        <label tuiLabel>E-pochta</label>
        <input
          placeholder="E-pochtani kiriting"
          tuiTextfield
          type="email"
          name="email"
          [(ngModel)]="email"
          email
          required
        />
      </tui-textfield>
    </div>

    <button
      tuiButton
      type="submit"
      size="m"
      appearance="accent"
      class="w-full font-medium! mt-2"
      [loading]="loadingProvider() === 'email'"
      [disabled]="forgotForm.invalid"
    >
      Havolani yuborish
    </button>
  </form>

  <p class="text-sm text-center text-gray-500 mt-8">
    Parolingiz yodingizga tushdimi?
    <a 
      routerLink="/auth/full/sign-in" 
      class="text-blue-500 hover:underline font-semibold transition-colors"
    >
      Kirishga qaytish
    </a>
  </p>
</div>
