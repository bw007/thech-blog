<div class="flex flex-col items-center">
  <div class="w-12 h-12 bg-app-bg-alt rounded-xl flex items-center justify-center mb-6">
    <tui-icon 
      icon="@tui.lock-keyhole" 
      class="text-green-400"
      [style.fontSize.rem]="1.5" 
    />
  </div>

  <h1 class="text-xl font-bold text-app-text-primary mb-2">Yangi parol o'rnating</h1>
  <p class="text-sm text-center text-app-text-muted mb-8 max-w-xs">
    Xavfsizlik uchun kuchli paroldan foydalaning (kamida 8 ta belgi).
  </p>

  <form
    #passwordForm="ngForm"
    (ngSubmit)="onResetPassword()"
    class="space-y-3 w-full max-w-sm"
  >
    <div>
      <tui-textfield tuiTextfieldSize="m" iconStart="@tui.lock">
        <label tuiLabel>Yangi parol</label>
        <input
          placeholder="Kamida 8 ta belgi"
          tuiTextfield
          name="password"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          [pattern]="passwordPattern()"
        />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error class="leading-6!" [error]="passwordError" />
    </div>

    <div>
      <tui-textfield tuiTextfieldSize="m" iconStart="@tui.lock">
        <label tuiLabel>Parolni tasdiqlang</label>
        <input
          placeholder="Parolni qayta kiriting"
          tuiTextfield
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          minlength="8"
        />
        <tui-icon tuiPassword />
      </tui-textfield>
      @if (newPassword() !== confirmPassword() && confirmPassword()) {
        <tui-error class="leading-6!" error="Parollar mos kelmadi" />
      }
    </div>

    <button
      tuiButton
      type="submit"
      size="m"
      appearance="accent"
      class="w-full font-medium! mt-2"
      [loading]="loadingProvider() === 'email'"
      [disabled]="passwordForm.invalid || newPassword() !== confirmPassword()"
    >
      Parolni yangilash
    </button>
  </form>
</div>
